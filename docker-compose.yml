# Optional convenience — run both tiers together.
# Requires GROQ_API_KEY in your shell or a backend/.env file.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host"
    depends_on: [backend]
